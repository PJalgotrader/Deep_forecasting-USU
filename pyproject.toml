[project]
name = "deep-forecasting-course"
version = "2026.9"
description = "The one local Python environment for DATA 5630 Deep Forecasting (Modules 2-5). Modules 6-7 run on Google Colab; Module 8 and the Nixtla final-project material have their own setup."
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- PyCaret (community fork of PyCaret 3: same `import pycaret`, same TSForecastingExperiment API) ---
    "pycaret-core==3.5.0",
    # statsmodels 0.15 renamed ETSResults.simulate(random_state=) -> rng=, which breaks
    # create_model('ets') through sktime 1.1.0. Drop this pin once sktime > 1.1.0 ships the
    # fix merged 2026-09-13 (sktime PR 10972).
    "statsmodels>=0.14,<0.15",
    # gradient-boosting models used by compare_models() (lightgbm_cds_dt, xgboost_cds_dt, catboost_cds_dt)
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    # interpret_model() in the PyCaret regression/classification demos
    "shap>=0.46",
    # --- utilities used by the Module 2-5 notebooks and the Python crash course ---
    "seaborn>=0.13",
    "yfinance>=0.2",
    "fredapi>=0.5",
    "openpyxl>=3.1",
    "xlrd>=2",
    "lxml>=5",
    "html5lib>=1.1",
    # --- notebooks ---
    "jupyterlab>=4",
    "ipykernel",
    "ipywidgets>=8",
]

[tool.uv]
package = false
# Always use a uv-managed Python. On Windows, uv would otherwise build the environment on top of an
# Anaconda Python found on PATH, and Anaconda's bundled DLLs break compiled packages inside notebooks.
python-preference = "only-managed"
