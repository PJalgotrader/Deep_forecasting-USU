# Deep Forecasting (DATA 5630/6630) - the course environment for Modules 2-5 (conda alternative to `uv sync`)
# Replaces the old DF_environment.yml (Python 3.7, no pycaret).
#   conda env create -f environment.yml
#   conda activate df_pycaret
name: df_pycaret
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - jupyterlab>=4
  - ipykernel
  - ipywidgets
  - pip:
      # community fork of PyCaret 3 - same `import pycaret`, same TSForecastingExperiment API
      - pycaret-core==3.5.0
      # pinned until sktime > 1.1.0 ships the statsmodels-0.15 fix (sktime PR 10972)
      - statsmodels>=0.14,<0.15
      - lightgbm>=4.0
      - xgboost>=2.0
      - catboost>=1.2
      - shap>=0.46
      # utilities used by the Module 2-5 notebooks and the Python crash course
      - seaborn>=0.13
      - yfinance>=0.2
      - fredapi>=0.5
      - openpyxl>=3.1
      - xlrd>=2
      - lxml>=5
      - html5lib>=1.1
