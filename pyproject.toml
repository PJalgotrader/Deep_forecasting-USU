[project]
name = "deep-forecasting-course"
version = "0.1.0"
description = "Local Python environment for DATA 5630 Deep Forecasting"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fredapi>=0.5,<0.6",
    "html5lib>=1.1,<2",
    "ipykernel>=7,<8",
    "ipywidgets>=8,<9",
    "jupyterlab>=4,<5",
    "keras>=3.12,<4",
    "lxml>=5,<7",
    "mapie>=1,<2",
    "matplotlib>=3.8,<4",
    "mlforecast>=1.1,<2",
    "neuralforecast>=3.2,<4",
    "neuralprophet>=0.9,<0.10",
    "numpy>=1.26,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.1,<3",
    "plotly>=5.24,<7",
    "plotly-resampler>=0.11,<0.12",
    "pmdarima>=2,<3",
    "prophet>=1.4,<2",
    "requests>=2.31,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<0.14",
    "sktime>=1,<2",
    "statsforecast>=2.1,<3",
    "statsmodels>=0.14,<0.15",
    "streamlit>=1.50,<2",
    "tensorflow>=2.20,<3; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "tensorflow>=2.16,<2.17; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "tqdm>=4.66,<5",
    "transformers>=5,<6",
    "utilsforecast>=0.2,<0.3",
    "xlrd>=2,<3",
    "xgboost>=2,<4",
    "yfinance>=0.2,<2",
]

[tool.uv]
package = false
